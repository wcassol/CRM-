# Supabase CLI Configuration — CRM Jurídico
# Documentação: https://supabase.com/docs/guides/cli/config

[project]
project_id = "crm-juridico"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://crm.escritorio.com.br"]
jwt_expiry = 28800          # 8 horas
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false       # cadastro apenas pelo admin
enable_confirmations = true
double_confirm_changes = true

[auth.sms]
enable_signup = false

[analytics]
enabled = false
